<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Report</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f7fc;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
color:#1e293b;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
text-align:center;
}

.card h2{
color:#2563eb;
font-size:35px;
margin-bottom:10px;
}

.section{
background:white;
padding:20px;
margin-top:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.progress-bar{
width:100%;
height:20px;
background:#e5e7eb;
border-radius:50px;
overflow:hidden;
margin-top:10px;
}

.progress-fill{
height:100%;
background:#22c55e;
width:0%;
transition:0.5s;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
background:#2563eb;
color:white;
padding:12px;
}

td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}

.status{
padding:5px 12px;
border-radius:20px;
background:#dcfce7;
color:#166534;
font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>Interview Preparation Assistant</h1>

<div class="cards">

<div class="card">
<h2 id="totalTests">0</h2>
<p>Total Tests</p>
</div>

<div class="card">
<h2 id="overallScore">0%</h2>
<p>Overall Score</p>
</div>

<div class="card">
<h2 id="codingSolved">0</h2>
<p>Coding Solved</p>
</div>

<div class="card">
<h2 id="mockCount">0</h2>
<p>Mock Interviews</p>
</div>

</div>

<!-- Aptitude -->

<div class="section">

<h2>Aptitude Progress</h2>

<div class="progress-bar">
<div class="progress-fill" id="aptitudeBar"></div>
</div>

<p id="aptitudeText">
Loading...
</p>

</div>

<!-- Coding -->

<div class="section">

<h2>Coding Progress</h2>

<div class="progress-bar">
<div class="progress-fill" id="codingBar"></div>
</div>

<p id="codingText">
Loading...
</p>

</div>

<!-- Mock Interview -->

<div class="section">

<h2>Mock Interview Progress</h2>

<div class="progress-bar">
<div class="progress-fill" id="mockBar"></div>
</div>

<p id="mockText">
Loading...
</p>

</div>

<!-- Resume -->

<div class="section">

<h2>Resume Builder</h2>

<p>
Resume Status:
<span class="status" id="resumeStatus">
Not Generated
</span>
</p>

</div>

<!-- Recent Activity -->

<div class="section">

<h2>Recent Activity</h2>

<table>

<thead>

<tr>
<th>Module</th>
<th>Result</th>
<th>Score</th>
<th>Date</th>
</tr>

</thead>

<tbody id="activityTable">

</tbody>

</table>

</div>

</div>

<script>

const API = "http://localhost:5001";

async function loadProgress(){

try{

const response = await fetch(
`${API}/api/progress`
);

const data = await response.json();

document.getElementById("totalTests")
.innerText = data.totalTests || 0;

document.getElementById("overallScore")
.innerText = (data.overallScore || 0) + "%";

document.getElementById("codingSolved")
.innerText = data.codingSolved || 0;

document.getElementById("mockCount")
.innerText = data.mockInterviews || 0;

/* Aptitude */

document.getElementById("aptitudeBar")
.style.width =
(data.aptitudeScore || 0) + "%";

document.getElementById("aptitudeText")
.innerText =
"Average Score : " +
(data.aptitudeScore || 0) + "%";

/* Coding */

document.getElementById("codingBar")
.style.width =
(data.codingScore || 0) + "%";

document.getElementById("codingText")
.innerText =
"Average Score : " +
(data.codingScore || 0) + "%";

/* Mock */

document.getElementById("mockBar")
.style.width =
(data.mockScore || 0) + "%";

document.getElementById("mockText")
.innerText =
"Average Score : " +
(data.mockScore || 0) + "%";

/* Resume */

document.getElementById("resumeStatus")
.innerText =
data.resumeGenerated
? "Generated"
: "Not Generated";

/* Activity Table */

let html = "";

data.activities.forEach(item=>{

html += `
<tr>

<td>${item.module}</td>

<td>${item.result}</td>

<td>${item.score}</td>

<td>${item.date}</td>

</tr>
`;

});

document.getElementById("activityTable")
.innerHTML = html;

}
catch(error){

console.log(error);

}

}

loadProgress();

</script>

</body>
</html>
